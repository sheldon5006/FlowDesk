<div class="user-page">

  <div class="page-header">
    <div>
      <h1>Users</h1>
      <p>Manage FlowDesk user accounts and roles.</p>
    </div>

    <p-button
      label="Add User"
      icon="pi pi-plus"
      (onClick)="openCreateDialog()"
    />
  </div>

  <app-user-list />

</div>

<p-dialog
  header="Create User"
  [(visible)]="createDialogVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '460px' }"
>

  <app-user-form
    (userCreated)="onUserCreated()"
    (cancelled)="closeCreateDialog()"
  />

</p-dialog>
