<section class="employee-page">

  <header class="page-header">

    <div>
      <h2>Employees</h2>

      <p>
        Manage your workforce and employee information.
      </p>
    </div>

    <p-button
      label="Add Employee"
      icon="pi pi-plus"
      (click)="openAddEmployeeDialog()"
    />

  </header>

  <section class="employee-list-section">
    <app-employee-list />
  </section>

  <p-dialog
    header="Add Employee"
    [(visible)]="addEmployeeDialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '34rem' }"
    [breakpoints]="{
      '768px': '70vw',
      '640px': '92vw'
    }"
  >

    <app-employee-form
      (employeeCreated)="onEmployeeCreated()"
    />

  </p-dialog>

</section>
